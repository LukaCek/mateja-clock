[platformio]
default_envs = cyd_photo_test

[env:cyd_photo_test]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
  bblanchon/ArduinoJson@6.21.6
  bodmer/TJpg_Decoder@1.1.0
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
build_flags =
  -Wall
  -Wextra
  -Werror=return-type
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I${PROJECT_DIR}/src/rtclink

[env:audio_diagnostic]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
build_src_filter =
  -<*>
  +<audio_diagnostic.cpp>
build_flags =
  -DMATEJA_AUDIO_DIAGNOSTIC
  -Wall
  -Wextra
  -Werror=return-type

[env:audio_lab]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
build_src_filter =
  -<*>
  +<audio_lab.cpp>
build_flags =
  -DMATEJA_AUDIO_LAB
  -Wall
  -Wextra
  -Werror=return-type

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<HomeLogic.cpp>
  +<AlarmLogic.cpp>
  +<MessageLogic.cpp>
  +<TimeSource.cpp>
  +<RtcLinkCore.cpp>
  +<rtclink/RtclinkProtocol.cpp>
test_filter =
  test_home_logic
  test_alarm_logic
  test_message_logic
  test_rtc_link
build_flags =
  -std=c++11
  -Wall
  -Wextra
  -Werror
  -pedantic
  -I${PROJECT_DIR}/src/rtclink
